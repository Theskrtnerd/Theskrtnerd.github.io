<!doctype html>
<html lang="en">

<title>Bach Tran — logo study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#161616;font-family:Arial,Helvetica,sans-serif}main{max-width:1120px;margin:auto;padding:48px 32px}header{display:flex;justify-content:space-between;gap:24px;align-items:baseline;margin-bottom:32px}h1{font-size:20px;font-weight:500;letter-spacing:-.6px;margin:0}header p,.label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#666}header p{margin:0}.hero{height:360px;background:white;display:grid;place-items:center;border-radius:20px}.hero img{width:256px;height:256px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{padding:26px 30px;background:white;border-radius:20px;min-height:180px}.label{margin:0 0 25px}.sizes{display:flex;align-items:center;gap:28px;height:80px}.sizes img{display:block}.reverse{background:#161616;color:white}.reverse .label{color:#aaa}.reverse img{filter:invert(1);width:100px;height:100px}.lockup{display:flex;align-items:center;gap:18px}.lockup img{width:64px;height:64px}.lockup span{font-size:30px;letter-spacing:-1.4px}.reference{display:flex;align-items:center;gap:28px}.reference svg{width:68px;height:58px}.reference p{font-size:13px;line-height:1.6;color:#666;margin:0;max-width:220px}footer{margin-top:24px;font-size:12px;color:#666;display:flex;justify-content:space-between;gap:16px}a{color:#161616;text-underline-offset:4px}a:focus-visible{outline:2px solid;outline-offset:4px}@media(max-width:600px){main{padding:24px 16px}header{align-items:flex-start;flex-direction:column;gap:8px}.hero{height:300px}.row{grid-template-columns:1fr}.card{padding:24px}.sizes{gap:22px}footer{flex-direction:column}}
</style>
<main>
  <header><h1>bach tran</h1><p>Abstract B · compact</p></header>

  <div class="row">
